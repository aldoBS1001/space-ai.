name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas del motor (Swift Package)
        working-directory: ios/SpaceAICore
        run: swift test 2>&1 | tee ../core-tests.log

      - name: Generar proyecto Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Elegir simulador iPhone disponible
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          # Permiso real de Fotos para las pruebas que lo usen (equivale a tocar "Permitir").
          xcrun simctl privacy "$UDID" grant photos com.businessshop.spaceai || true

      - name: Pruebas unitarias y de interfaz en simulador
        run: |
          set -o pipefail
          xcodebuild test -project SpaceAI.xcodeproj -scheme SpaceAI \
            -destination "id=$SIM_UDID" -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild-test.log | tail -50

      - name: Compilación para dispositivo (Release, sin firma)
        run: |
          set -o pipefail
          xcodebuild build -project SpaceAI.xcodeproj -scheme SpaceAI -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO | tail -20

      - name: Archivo firmado e IPA (solo si existen los secretos de Apple)
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$PROFILE_B64" ] || [ -z "$TEAM_ID" ]; then
            echo "Sin secretos de firma: no se genera IPA (no se simula)."; exit 0
          fi
          KC=$RUNNER_TEMP/signing.keychain-db; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"; security set-keychain-settings -lut 21600 "$KC"; security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12_B64" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/spaceai.mobileprovision
          PROFILE_NAME=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/spaceai.mobileprovision | plutil -extract Name raw -)
          sed -e "s/__TEAM_ID__/$TEAM_ID/" -e "s/__PROFILE_NAME__/$PROFILE_NAME/" ExportOptions.plist.template > ExportOptions.plist
          xcodebuild archive -project SpaceAI.xcodeproj -scheme SpaceAI -configuration Release -archivePath SpaceAI.xcarchive \
            -destination 'generic/platform=iOS' DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
          xcodebuild -exportArchive -archivePath SpaceAI.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath export
          ls -la export && shasum -a 256 export/*.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spaceai-ios
          path: |
            ios/TestResults.xcresult
            ios/core-tests.log
            ios/xcodebuild-test.log
            ios/export/
