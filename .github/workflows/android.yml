name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del motor (JVM) y unitarias de la app
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: APK de prueba (debug)
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Preparar firma de release (solo si existen los secretos)
        env:
          KEYSTORE_B64: ${{ secrets.SPACEAI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SPACEAI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firma de release: activada"
          else
            echo "Firma de release: sin secretos; el AAB/APK de release quedan SIN FIRMAR"
          fi

      - name: AAB y APK de release
        env:
          SPACEAI_KEYSTORE_PASSWORD: ${{ secrets.SPACEAI_KEYSTORE_PASSWORD }}
          SPACEAI_KEY_ALIAS: ${{ secrets.SPACEAI_KEY_ALIAS }}
          SPACEAI_KEY_PASSWORD: ${{ secrets.SPACEAI_KEY_PASSWORD }}
          SPACEAI_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease

      - name: Verificar binarios y permisos reales del APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          ls -la app/build/outputs/apk/*/ app/build/outputs/bundle/release/
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump permissions "$APK" | tee permisos-apk.txt
          if grep -E "INTERNET|MANAGE_EXTERNAL_STORAGE|QUERY_ALL_PACKAGES" permisos-apk.txt; then
            echo "Permiso no permitido encontrado"; exit 1
          fi
          sha256sum "$APK" "$AAB" app/build/outputs/apk/release/*.apk | tee sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: spaceai-android
          path: |
            android/app/build/outputs/apk/
            android/app/build/outputs/bundle/release/
            android/app/build/outputs/mapping/release/
            android/permisos-apk.txt
            android/sha256.txt

      - name: Lint (incluye reglas de permisos y Play)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Publicar hallazgos de lint como anotaciones
        if: failure()
        run: |
          F=app/build/reports/lint-results-debug.xml
          test -f "$F" || exit 0
          python3 - "$F" <<'PY'
          import sys, xml.etree.ElementTree as ET
          n = 0
          for i in ET.parse(sys.argv[1]).getroot().iter("issue"):
              if i.get("severity") not in ("Error", "Fatal"): continue
              loc = i.find("location"); f = loc.get("file", "") if loc is not None else ""
              f = f[f.find("android/"):] if "android/" in f else f
              line = loc.get("line", "1") if loc is not None else "1"
              print(f"::error file={f},line={line},title=lint {i.get('id')}::{i.get('message')}")
              n += 1
              if n >= 40: break
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spaceai-android-reportes
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/

  device-tests:
    # Pruebas instrumentadas en emulador real (MediaStore, Keystore, Compose UI).
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest || (python3 ../tools/ci_junit_annotations.py 'app/build/outputs/androidTest-results/connected/**/*.xml'; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spaceai-android-device-tests-api${{ matrix.api }}
          path: android/app/build/reports/androidTests/
